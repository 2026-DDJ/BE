spring.application.name=medicast
spring.jpa.hibernate.ddl-auto=validate

# Base64-encoded secret with at least 32 decoded bytes (HS256)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

ai.model.base-url=${AI_MODEL_BASE_URL:http://localhost:8000}
ai.model.prediction-path=${AI_MODEL_PREDICTION_PATH:/predict}
ai.model.connect-timeout=${AI_MODEL_CONNECT_TIMEOUT:2s}
ai.model.read-timeout=${AI_MODEL_READ_TIMEOUT:10s}
ai.model.version=${AI_MODEL_VERSION:external-model-v1}
ai.model.preprocessing-version=${AI_MODEL_PREPROCESSING_VERSION:external-preprocessing-v1}
