openapi: 3.1.0
info:
  title: MEDICAST Predictions API
  version: 1.0.0
  description: Notion 15개 입력을 받아 평가를 저장하고 AI 의료비 예측을 생성한다.
paths:
  /predictions:
    post:
      summary: 평가 입력과 예측 생성
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionCreateRequest'
            example:
              householdSize: 3
              incomeRange: 2400-4500
              healthInsuranceType: '1'
              region: 서울특별시
              selfRatedHealth: FAIR
              heightCm: 170
              weightKg: 65
              exercises: true
              outpatientVisitsLastYear: 4
              dentalVisitsLastYear: 1
              hasPrivateHealthInsurance: true
              hospitalizedLastYear: false
              activityLimitation: NONE
              anxietyDepression: SOME
              occupation: '31'
      responses:
        '201':
          description: 평가와 예측이 생성됨. 모델 실패도 FAILED 상태로 기록된다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /predictions/{predictionId}:
    get:
      summary: 본인 예측 조회
      security:
        - bearerAuth: []
      parameters:
        - name: predictionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 예측 상태와 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않거나 다른 사용자의 예측
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /predictions/{predictionId}/simulations:
    post:
      summary: BMI·운동 조건별 의료비 비교
      description: 기존 예측의 다른 입력은 유지하고 BMI와 운동 여부만 바꿔 AI를 다시 호출한다. 결과는 저장하지 않는다.
      security:
        - bearerAuth: []
      parameters:
        - name: predictionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
            example:
              bmi: 20.0
              exercises: true
      responses:
        '200':
          description: 변경 전·후 예측 비교
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 존재하지 않거나 다른 사용자의 예측
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 기준 예측이 완료 상태가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: AI 모델이 요청을 거부했거나 잘못된 응답을 반환함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AI 모델 timeout 또는 일시적 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: 누락, 범위 초과 또는 허용되지 않은 enum
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 유효한 Bearer JWT가 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PredictionCreateRequest:
      type: object
      required:
        - householdSize
        - incomeRange
        - healthInsuranceType
        - region
        - selfRatedHealth
        - heightCm
        - weightKg
        - exercises
        - outpatientVisitsLastYear
        - dentalVisitsLastYear
        - hasPrivateHealthInsurance
        - hospitalizedLastYear
        - activityLimitation
        - anxietyDepression
        - occupation
      properties:
        householdSize:
          type: integer
          minimum: 1
          maximum: 10
        incomeRange:
          type: string
          enum: [under-2400, 2400-4500, 4500-7500, over-7500]
        healthInsuranceType:
          type: string
          enum: ['1', '2', '3', '4', '5', '6', '7', none]
        region:
          type: string
          enum: [서울특별시, 부산광역시, 대구광역시, 인천광역시, 광주광역시, 대전광역시, 울산광역시, 세종특별자치시, 경기도, 강원특별자치도, 충청북도, 충청남도, 전북특별자치도, 전라남도, 경상북도, 경상남도, 제주특별자치도]
        selfRatedHealth:
          type: string
          enum: [VERY_GOOD, GOOD, FAIR, POOR, VERY_POOR]
        heightCm:
          type: number
          exclusiveMinimum: 0
          description: cm. 제품 상한과 소수점 정책은 아직 미확정이다.
        weightKg:
          type: number
          exclusiveMinimum: 0
          description: kg. 제품 상한과 소수점 정책은 아직 미확정이다.
        exercises:
          type: boolean
        outpatientVisitsLastYear:
          type: integer
          minimum: 0
          description: 기술적 상한은 아직 미확정이다.
        dentalVisitsLastYear:
          type: integer
          minimum: 0
          description: 기술적 상한은 아직 미확정이다.
        hasPrivateHealthInsurance:
          type: boolean
        hospitalizedLastYear:
          type: boolean
        activityLimitation:
          type: string
          enum: [NONE, SOME, SEVERE]
        anxietyDepression:
          type: string
          enum: [NONE, SOME, SEVERE]
        occupation:
          type: string
          enum: ['14', '24', '31', '42', '52', '61', '78', '87', '94', none]
    PredictionResponse:
      type: object
      required: [id, assessmentId, status, currency, retryable, createdAt]
      properties:
        id:
          type: integer
          format: int64
        assessmentId:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        predictedAnnualMedicalCost:
          type: [number, 'null']
        sameIncomeGroupMean:
          description: 동일 소득 구간의 평균 연간 의료비. 예측이 완료되지 않았으면 null이다.
          type: [number, 'null']
          minimum: 0
        sameOutpatientVisitsGroupMean:
          description: 동일 외래 이용 횟수 구간의 평균 연간 의료비. 예측이 완료되지 않았으면 null이다.
          type: [number, 'null']
          minimum: 0
        overallMean:
          description: 전체 평균 연간 의료비. 예측이 완료되지 않았으면 null이다.
          type: [number, 'null']
          minimum: 0
        currency:
          type: string
          const: KRW
        modelVersion:
          type: [string, 'null']
        errorCode:
          type: [string, 'null']
        retryable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    SimulationRequest:
      type: object
      required: [bmi, exercises]
      properties:
        bmi:
          type: number
          minimum: 15
          maximum: 40
        exercises:
          type: boolean
    SimulationCondition:
      type: object
      required: [bmi, exercises, predictedAnnualMedicalCost]
      properties:
        bmi:
          type: number
        exercises:
          type: boolean
        predictedAnnualMedicalCost:
          type: number
          minimum: 0
    SimulationResponse:
      type: object
      required: [predictionId, before, after, annualMedicalCostDifference, currency, modelVersion]
      properties:
        predictionId:
          type: integer
          format: int64
        before:
          $ref: '#/components/schemas/SimulationCondition'
        after:
          $ref: '#/components/schemas/SimulationCondition'
        annualMedicalCostDifference:
          type: number
          description: 변경 후 - 변경 전 금액
        currency:
          type: string
          const: KRW
        modelVersion:
          type: string
    ErrorResponse:
      type: object
      required: [status, code, message, timestamp]
      properties:
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
